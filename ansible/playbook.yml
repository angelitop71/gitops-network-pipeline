---
- name: Configurar servidores web desplegados por OpenTofu
  hosts: web
  gather_facts: false

  tasks:
    # La imagen base es Debian minima: se instala Python antes que nada
    - name: Bootstrap de Python (modulo raw, no requiere Python)
      ansible.builtin.raw: >
        test -x /usr/bin/python3 && dpkg -s python3-apt >/dev/null 2>&1 && command -v ip >/dev/null ||
        (apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-apt iproute2)
      changed_when: false

    - name: Recolectar facts
      ansible.builtin.setup:

    # ---------------- Paquetes ----------------
    - name: Instalar nginx, iptables y utilidades
      ansible.builtin.apt:
        name: [nginx, iptables, procps]
        state: present
        update_cache: true
        cache_valid_time: 3600

    # ---------------- Servicio web ----------------
    - name: Configurar nginx para escuchar en los puertos definidos en el codigo
      ansible.builtin.template:
        src: templates/nginx-site.conf.j2
        dest: /etc/nginx/sites-available/default
        mode: "0644"

    - name: Verificar conectividad hacia la DB por la red backend
      ansible.builtin.shell: timeout 3 bash -c '</dev/tcp/db/6379'
      args:
        executable: /bin/bash
      register: db_check
      changed_when: false
      failed_when: false

    - name: Publicar pagina con info del despliegue
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
        mode: "0644"

    - name: Validar configuracion de nginx
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Iniciar o recargar nginx (contenedor sin systemd)
      ansible.builtin.shell: pgrep -x nginx >/dev/null && nginx -s reload || nginx
      changed_when: true

    # ---------------- Firewall del host (iptables) ----------------
    # Se reconstruye la cadena INPUT completa en cada despliegue:
    # el codigo es la unica fuente de verdad (lo que no esta, se borra).
    - name: Politica temporal ACCEPT mientras se reconstruye
      ansible.builtin.iptables:
        chain: INPUT
        policy: ACCEPT

    - name: Limpiar reglas anteriores de INPUT
      ansible.builtin.iptables:
        chain: INPUT
        flush: true

    - name: Permitir loopback (incluye DNS interno de Docker)
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: lo
        jump: ACCEPT

    - name: Permitir trafico de conexiones ya establecidas
      ansible.builtin.iptables:
        chain: INPUT
        ctstate: [ESTABLISHED, RELATED]
        jump: ACCEPT

    - name: Permitir puertos definidos en firewall_rules
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "{{ item.port | string }}"
        source: "{{ item.source }}"
        jump: ACCEPT
        comment: "gitops {{ item.name }}"
      loop: "{{ firewall_rules }}"
      loop_control:
        label: "{{ item.name }} {{ item.port }}/tcp desde {{ item.source }}"

    - name: Politica por defecto DROP (todo lo no declarado se bloquea)
      ansible.builtin.iptables:
        chain: INPUT
        policy: DROP
