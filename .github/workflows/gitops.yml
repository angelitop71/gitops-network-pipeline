name: GitOps Network Pipeline

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", "ansible/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["infra/**", "ansible/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      action:
        description: "Accion manual"
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  contents: write # el pipeline commitea el estado de OpenTofu
  pull-requests: write

# nunca dos despliegues al mismo tiempo sobre la misma infraestructura
concurrency:
  group: gitops-network
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  ANSIBLE_FORCE_COLOR: "1"

jobs:
  # ------------------------------------------------------------
  # 1) En cada Pull Request: validar y mostrar el plan
  # ------------------------------------------------------------
  plan:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Formato
        run: tofu fmt -check -recursive

      - name: Init
        run: tofu init -input=false

      - name: Validate
        run: tofu validate

      - name: Plan
        run: |
          tofu plan -input=false -no-color -out=tfplan
          tofu show -no-color tfplan > plan.txt

      - name: Comentar el plan en el PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('infra/plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (recortado)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Plan de OpenTofu\n```hcl\n' + plan + '\n```'
            });

      - name: Chequeo de sintaxis Ansible
        working-directory: ansible
        run: |
          printf '[web]\n' > inventory.ini
          ansible-playbook playbook.yml --syntax-check

  # ------------------------------------------------------------
  # 2) Al hacer merge/push a main: aplicar y configurar
  # ------------------------------------------------------------
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: OpenTofu apply
        working-directory: infra
        run: |
          tofu init -input=false
          tofu apply -input=false -auto-approve
          tofu output -raw ansible_inventory > ../ansible/inventory.ini
          tofu output -json firewall_rules > ../ansible/firewall_rules.json
          tofu output -json web_urls > ../web_urls.json
          echo "--- Inventario generado ---"; cat ../ansible/inventory.ini

      - name: Guardar estado en el repositorio
        if: always()
        run: |
          git config user.name "gitops-bot"
          git config user.email "gitops-bot@users.noreply.github.com"
          if [ -f infra/terraform.tfstate ]; then git add infra/terraform.tfstate; fi
          git diff --cached --quiet || git commit -m "chore: actualizar estado OpenTofu [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main

      - name: Ansible playbook
        working-directory: ansible
        run: |
          ansible-playbook playbook.yml \
            -e "{\"firewall_rules\": $(cat firewall_rules.json)}" \
            -e "git_sha=${GITHUB_SHA::7}"

      - name: Smoke test
        run: |
          for url in $(jq -r '.[]' web_urls.json); do
            echo "Probando $url ..."
            curl -fsS --retry 5 --retry-delay 2 "$url" | grep -q "GitOps Network Pipeline"
            echo "OK $url"
          done
          echo "Probando que la DB NO es accesible desde el host..."
          if timeout 3 bash -c '</dev/tcp/localhost/6379' 2>/dev/null; then
            echo "ERROR: el puerto 6379 esta expuesto"; exit 1
          fi
          echo "OK: DB aislada en la red backend"

      - name: Resumen
        run: |
          echo "## Despliegue OK (commit ${GITHUB_SHA::7})" >> $GITHUB_STEP_SUMMARY
          for url in $(jq -r '.[]' web_urls.json); do echo "- $url" >> $GITHUB_STEP_SUMMARY; done

  # ------------------------------------------------------------
  # 3) Manual: destruir todo
  # ------------------------------------------------------------
  destroy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: OpenTofu destroy
        working-directory: infra
        run: |
          tofu init -input=false
          tofu destroy -input=false -auto-approve

      - name: Guardar estado en el repositorio
        if: always()
        run: |
          git config user.name "gitops-bot"
          git config user.email "gitops-bot@users.noreply.github.com"
          if [ -f infra/terraform.tfstate ]; then git add infra/terraform.tfstate; fi
          git diff --cached --quiet || git commit -m "chore: estado tras destroy [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
